    <script>
        document.addEventListener('DOMContentLoaded', function() {
            console.log('Verificando status de login do administrador...');
            if (sessionStorage.getItem('adminLoggedIn')) {
                console.log('Administrador está logado.');
                document.getElementById('admin-login-link').style.pointerEvents = 'none';
                document.getElementById('admin-login-link').style.color = 'gray';
            } else {
                console.log('Administrador não está logado.');
            }
        });

        document.addEventListener('DOMContentLoaded', function() {
            if (sessionStorage.getItem('adminLoggedIn')) {
                const adminEmail = sessionStorage.getItem('adminEmail');
                document.getElementById('user-greeting').textContent = `Bem-vindo, ${adminEmail}`;
                document.getElementById('logout').style.display = 'block';
            }
        });

        function logout() {
            sessionStorage.removeItem('adminLoggedIn');
            sessionStorage.removeItem('adminEmail');
            window.location.href = 'index.html';
        }
    </script>

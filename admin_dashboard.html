<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Administrador</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <nav>
            <!-- ...código existente... -->
            <ul class="dropdown-item">
                <a id="item" href="#">
                    <li>Administração</li>
                </a>
                <div class="dropdown-content">
                    <a class="cad-email-adm" href="config_email.html">Cadastrar Administrador</a>
                    <a class="cad-email-adm" href="admin_login.html">Login do Administrador</a>
                    <a class="cad-email-adm" href="recover_password.html">Recuperar Senha do Administrador</a>
                </div>
            </ul>
            <ul id="user-greeting-container" style="display: none;">
                <span id="user-greeting"></span>
            </ul>
            <ul id="logout" style="display: none;">
                <button onclick="adminLogout()">Sair</button>
            </ul>
            <!-- ...código existente... -->
        </nav>
    </header>

    <main id="main-admin-dashboard">
        <h1>Painel do Administrador</h1>
        <a class="cad-email-adm" href="config_email.html">Cadastrar Email</a>
        <button id="load-users">Carregar Dados dos Usuários</button>
        <table id="users-table" style="display:none;">
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Email</th>
                    <th>Telefone</th>
                    <th>Resultado do Quiz</th>
                    <th>Data e Hora do Quiz</th> <!-- Nova Coluna -->
                </tr>
            </thead>
            <tbody>
                <!-- Dados dos usuários serão carregados aqui -->
            </tbody>
        </table>
        <button id="logout-button-main">Sair</button> <!-- Botão de Sair na tag main -->
    </main>

    <footer>
        <img id="logo-footer" src="logo-baysoft.webp" />
        <span>Todos os direitos reservados &copy;</span>
        <span>Desenvolvido por: Bay Software - H & E Silva</span>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const userGreeting = document.getElementById('user-greeting');
            const userGreetingContainer = document.getElementById('user-greeting-container');
            const adminEmail = localStorage.getItem('admin');
            if (adminEmail) {
                userGreeting.innerHTML = `Você está logado como ADMINISTRADOR<br>Email: ${adminEmail}`;
                userGreetingContainer.style.display = 'block';
                document.getElementById('logout').style.display = 'block';
            }

            const loadUsersButton = document.getElementById('load-users');
            const cadEmailLinks = document.querySelectorAll('.cad-email-adm');
            loadUsersButton.addEventListener('click', function () {
                loadUsersButton.classList.add('hidden');
                cadEmailLinks.forEach(link => link.classList.add('hidden'));
                document.getElementById('users-table').style.display = 'table';
            });
        });

        function adminLogout() {
            localStorage.removeItem('admin');
            window.location.href = 'admin_login.html';
        }
    </script>
    <script src="script.js"></script>
</body>

</html>

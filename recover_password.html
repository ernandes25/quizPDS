<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperação de Senha</title>
</head>

<body>
    <form id="recover-password-form">
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
        <button type="submit">Recuperar Senha</button>
    </form>

    <script>
        document.getElementById('recover-password-form').addEventListener('submit', function (event) {
            event.preventDefault();
            const formData = new FormData(this);
            formData.append('action', 'recuperar_senha');

            fetch('process_form.php', {
                method: 'POST',
                body: formData
            })
                .then(response => {
                    console.log('Resposta do servidor:', response);
                    return response.text(); // Obtenha a resposta como texto
                })
                .then(text => {
                    try {
                        const data = JSON.parse(text); // Tente analisar como JSON
                        console.log('Dados recebidos:', data);
                        alert(data.message);
                    } catch (error) {
                        console.error('Erro ao analisar JSON:', error);
                        console.error('Resposta do servidor:', text); // Exiba a resposta do servidor para depuração
                        alert('Ocorreu um erro ao processar sua solicitação. Por favor, tente novamente mais tarde.');
                    }
                })
                .catch(error => {
                    console.error('Erro:', error);
                    alert('Ocorreu um erro ao processar sua solicitação. Por favor, tente novamente mais tarde.');
                });
        });
    </script>
</body>

</html>

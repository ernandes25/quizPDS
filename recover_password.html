<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperação de Senha</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="recover-password-adm">
        <span id="close-button-adm" onclick="closeRecoverPasswordAdmim()">×</span>
        <form id="recover-password-form">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
            <button id="button-recover-adm" type="submit">Recuperar Senha</button>
        </form>
    </div>
    <div id="message-container" class="message"></div>

    <script>
        function closeRecoverPasswordAdmim() {
            window.location.href = 'index.html';
        }

        document.getElementById('recover-password-form').addEventListener('submit', function (event) {
            event.preventDefault();
            const formData = new FormData(this);
            formData.append('action', 'recuperar_senha');

            fetch('process_form.php', {
                method: 'POST',
                body: formData
            })
                .then(response => {
                    console.log('Resposta do servidor:', response);
                    return response.text();
                })
                .then(text => {
                    const messageContainer = document.getElementById('message-container');
                    try {
                        const data = JSON.parse(text);
                        console.log('Dados recebidos:', data);
                        messageContainer.innerHTML = `${data.message}<br><a href="index.html">RETORNAR À PÁGINA INICIAL</a>`;
                        messageContainer.className = 'message success';
                    } catch (error) {
                        console.error('Erro ao analisar JSON:', error);
                        console.error('Resposta do servidor:', text);
                        messageContainer.innerHTML = 'Ocorreu um erro ao processar sua solicitação. Por favor, tente novamente mais tarde.<br><a href="index.html">RETORNAR À PÁGINA INICIAL</a>';
                        messageContainer.className = 'message error';
                    }
                    messageContainer.style.display = 'block';
                })
                .catch(error => {
                    console.error('Erro:', error);
                    const messageContainer = document.getElementById('message-container');
                    messageContainer.innerHTML = 'Ocorreu um erro ao processar sua solicitação. Por favor, tente novamente mais tarde.<br><a href="index.html">RETORNAR À PÁGINA INICIAL</a>';
                    messageContainer.className = 'message error';
                    messageContainer.style.display = 'block';
                });
        });
    </script>
</body>

</html>

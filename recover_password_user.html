<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperação de Senha do Usuário</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <div id="modal-background" class="modal-background" style="display: block;"></div>
    <div id="recover-password-modal" class="modal" style="display: block;">
        <span class="close-button" onclick="closeRecoverPasswordModal()">×</span>
        <form id="recover-password-form" action="process_form.php" method="POST">
            <label for="recover-email">Email:</label>
            <input type="email" id="recover-email" name="email" required>
            <input type="hidden" name="action" value="recuperar_senha_usuario">
            <button type="submit" id="button-recover">Recuperar Senha</button>
        </form>
    </div>
    <div id="message-container" class="message"></div>
    <div id="loading-animation" class="loading-animation">Processando...</div>

    <script>
        function closeRecoverPasswordModal() {
            window.location.href = 'index.html';
        }

        document.getElementById('recover-password-form').addEventListener('submit', function (event) {
            event.preventDefault();
            const formData = new FormData(this);
            formData.append('action', 'recuperar_senha_usuario');

            document.getElementById('loading-animation').style.display = 'block';

            fetch('process_form.php', {
                method: 'POST',
                body: formData
            })
                .then(response => {
                    return response.text();
                })
                .then(text => {
                    document.getElementById('loading-animation').style.display = 'none';
                    const messageContainer = document.getElementById('message-container');
                    try {
                        const data = JSON.parse(text);
                        messageContainer.innerHTML = `${data.message}<br><a href="index.html">RETORNAR À PÁGINA INICIAL</a>`;
                        messageContainer.className = 'message success';
                    } catch (error) {
                        messageContainer.innerHTML = 'Ocorreu um erro ao processar sua solicitação. Por favor, tente novamente mais tarde.<br><a href="index.html">RETORNAR À PÁGINA INICIAL</a>';
                        messageContainer.className = 'message error';
                    }
                    messageContainer.style.display = 'block';
                })
                .catch(error => {
                    document.getElementById('loading-animation').style.display = 'none';
                    const messageContainer = document.getElementById('message-container');
                    messageContainer.innerHTML = 'Ocorreu um erro ao processar sua solicitação. Por favor, tente novamente mais tarde.<br><a href="index.html">RETORNAR À PÁGINA INICIAL</a>';
                    messageContainer.className = 'message error';
                    messageContainer.style.display = 'block';
                });
        });
    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Configuração de Email do Administrador</title>
    <link rel="stylesheet" href="style.css" />
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // Verificar se o administrador está logado
            const adminEmail = localStorage.getItem('admin');
            if (!adminEmail) {
                alert("Acesso negado. Faça login como administrador.");
                window.location.href = 'admin_login.html'; // Redireciona para a página de login do administrador
            } else {
                const userGreeting = document.getElementById('user-greeting');
                const userGreetingContainer = document.getElementById('user-greeting-container');
                userGreeting.innerHTML = `Você está logado como ADMINISTRADOR<br>Email: ${adminEmail}`;
                userGreetingContainer.style.display = 'block';
                document.getElementById('logout').style.display = 'block';
            }
        });

        function adminLogout() {
            localStorage.removeItem('admin');
            window.location.href = 'admin_login.html';
        }
    </script>
</head>

<body>
    <header>
        <nav>
            <!-- ...código existente... -->
            <ul class="dropdown-item">
                <a id="item" href="#">
                    <li>Administração</li>
                </a>
                <div class="dropdown-content">
                    <a class="cad-email-adm" href="config_email.html">Cadastrar Administrador</a>
                    <a class="cad-email-adm" href="admin_login.html">Login do Administrador</a>
                    <a class="cad-email-adm" href="recover_password.html">Recuperar Senha do Administrador</a>
                </div>
            </ul>
            <ul id="user-greeting-container" style="display: none;">
                <span id="user-greeting"></span>
            </ul>
            <ul id="logout" style="display: none;">
                <button onclick="adminLogout()">Sair</button>
            </ul>
            <!-- ...código existente... -->
        </nav>
    </header>

    <main class="main-cad-adm">
        
        <form id="admin-email-form" action="process_form.php" method="POST">
            <h2>Cadastro de administrador</h2>
            <label for="admin-email">Email:</label>
            <input type="email" id="admin-email" name="email" required><br>
            <label for="admin-password">Senha:</label>
            <input type="password" id="admin-password" name="senha" required><br>
            <input type="hidden" name="action" value="cadastrar_email_admin">
            <button class="button-cad-adm" type="submit">Cadastrar Email</button>
        </form>
        <button onclick="adminLogout()">Sair</button> <!-- Botão de Sair -->
    </main>

    <footer>
        <p>&copy; 2024 Seu Site. Todos os direitos reservados.</p>
    </footer>
    <script src="script.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login do Administrador</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <nav>
            <ul>
                <img id="logo" src="logo.jpeg" />
            </ul>
            <ul>
                <a class="item" href="index.html">
                    <li>Início</li>
                </a>
            </ul>
            <ul>
                <a class="item" href="sobre.html">
                    <li>Sobre nós</li>
                </a>
            </ul>
            <ul>
                <a class="item" href="contato.html">
                    <li>Fale comigo</li>
                </a>
            </ul>
            <ul>
                <a class="item" href="cadastro.html">
                    <li>Cadastro</li>
                </a>
            </ul>
            <ul class="dropdown">
                <a class="item" href="#">
                    <li>Administração</li>
                </a>
                <div class="dropdown-content">
                    <a href="config_email.html">Cadastrar Email</a>
                    <a href="admin_login.html" id="admin-login-link">Login do Administrador</a>
                </div>
            </ul>
            <ul id="logout" style="display: none;">
                <button onclick="logout()">Sair</button>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Login do Administrador</h1>

        <form id="admin-login-form" method="POST" action="process_form.php">
            <input type="hidden" name="action" value="admin_login">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
            <label for="senha">Senha:</label>
            <input type="password" id="senha" name="senha" required>
            <button type="submit">Login</button>
        
    </main>

    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            console.log('Verificando status de login do administrador...');
            if (sessionStorage.getItem('adminLoggedIn')) {
                console.log('Administrador está logado.');
                document.getElementById('admin-login-link').style.pointerEvents = 'none';
                document.getElementById('admin-login-link').style.color = 'gray';
            } else {
                console.log('Administrador não está logado.');
            }

            document.getElementById('admin-login-form').addEventListener('submit', function(event) {
                event.preventDefault();
                const formData = new FormData(this);
                fetch('process_form.php', {
                    method: 'POST',
                    body: formData
                })
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'success') {
                        sessionStorage.setItem('adminLoggedIn', true);
                        window.location.href = data.redirect;
                    } else {
                        alert(data.message);
                    }
                })
                .catch(error => console.error('Erro:', error));
            });
        });
    </script>

    <footer>
        <p>&copy; 2024 Seu Site. Todos os direitos reservados.</p>
    </footer>
</body>
</html>
